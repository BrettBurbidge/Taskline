
services:
  postgres:
    image: postgres:16-alpine
    container_name: papa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: papa
      POSTGRES_PASSWORD: papa_dev_password
      POSTGRES_DB: papa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papa -d papa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: papa-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://papa:papa_dev_password@postgres:5432/papa_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NODE_ENV: production
      ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node build"

volumes:
  postgres_data:


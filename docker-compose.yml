
services:
  postgres:
    image: postgres:16-alpine
    container_name: papa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: papa
      POSTGRES_PASSWORD: papa_dev_password
      POSTGRES_DB: papa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:




services:
  postgres:
    image: postgres:16-alpine
    container_name: taskline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskline
      POSTGRES_PASSWORD: taskline_dev_password
      POSTGRES_DB: taskline_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskline -d taskline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskline-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://taskline:taskline_dev_password@postgres:5432/taskline_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NODE_ENV: production
      ORIGIN: http://localhost:3000
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Denver}
      TZ: ${TZ:-America/Denver}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node build"

volumes:
  postgres_data:

